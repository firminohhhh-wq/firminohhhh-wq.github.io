<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعليم السياقة</title>
<style>
:root{--bg:#e9ebee;--card:#fff;--ink:#1d2127;--sub:#59616d;--line:#cfd4db;--road:#f2b705;--on:#1d2127;--ok:#1c8a5a;--bad:#c8102e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#232730;--ink:#f1f3f5;--sub:#a3abb7;--line:#3a404b;--ok:#35b57f;--bad:#ef4a62}}
:root[data-theme="dark"]{--bg:#15181d;--card:#232730;--ink:#f1f3f5;--sub:#a3abb7;--line:#3a404b;--ok:#35b57f;--bad:#ef4a62}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,'Noto Sans Arabic','Segoe UI',system-ui,sans-serif;font-size:1.05rem}
#wrap{max-width:540px;margin:0 auto;padding:12px 14px 28px}
.hero{display:block;width:100%;border-radius:14px;margin-bottom:12px}
h2{font-family:'Reem Kufi',Tajawal,sans-serif;font-size:1.5rem;margin:0}
p{margin:6px 0;color:var(--sub);line-height:1.6}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.back{border:0;background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:700 .95rem Tajawal,'Noto Sans Arabic',sans-serif;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font:700 1.35rem 'Reem Kufi',Tajawal,sans-serif}
.stats span{font-size:.8rem;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right;background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:14px;font:inherit;cursor:pointer;border-bottom:4px solid var(--line)}
.card .ic{font-size:1.9rem}.card b{font-size:1.1rem}.card small{color:var(--sub);font-size:.85rem;line-height:1.4}
.card.big{grid-column:1/3;background:var(--road);color:var(--on);border-bottom-color:#b88800}
.card.big small{color:#3b3000}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer;text-align:right}
.row .ic{font-size:1.8rem}.row .tx{flex:1;display:flex;flex-direction:column;gap:4px}.row small{color:var(--sub)}.row .sc{font-weight:700}
.pb{display:block;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pb u{display:block;height:100%;background:var(--road)}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:10px;background:var(--road);color:var(--on);font:700 1.1rem Tajawal,sans-serif;padding:14px;margin:10px 0;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.q{font-weight:700;font-size:1.2rem;line-height:1.6;margin:0 0 12px}
.box{background:var(--card);border-radius:14px;padding:16px;margin:10px 0}
.sign{display:flex;justify-content:center;margin:4px 0 12px}.sign svg{width:96px;height:96px}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font:500 1rem Tajawal,sans-serif;cursor:pointer;line-height:1.5}
.opt.ok{border-color:var(--ok);background:var(--ok);color:#fff}.opt.bad{border-color:var(--bad);background:var(--bad);color:#fff}.opt.sel{border-color:var(--road);background:var(--road);color:var(--on)}
.exp{margin-top:10px;padding:10px 12px;border-right:5px solid var(--road);background:var(--bg);border-radius:6px;line-height:1.6}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.95rem}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(to left,var(--road) 0 16px,transparent 16px 24px);transition:width .3s}
.score{font:700 3.4rem 'Reem Kufi',Tajawal,sans-serif;text-align:center;margin:6px 0}
.verdict{text-align:center;font-weight:700;font-size:1.2rem;margin:0 0 8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg .box{margin:0;text-align:center;padding:12px}.sg svg{width:80px;height:80px}.sg b{display:block;margin-top:6px}.sg small{color:var(--sub)}
ul.tips{padding:0 18px 0 0;line-height:1.9}
</style>

   $("ex").innerHTML=(ex?"":'<div class="exp"><b>'+(ok?"إجابة صحيحة. ":"إجابة خاطئة. ")+'</b>'+q.e+'</div>')+'<button class="btn" id="nx">'+(i+1<list.length?"التالي":"عرض النتيجة")+'</button>';
   $("nx").onclick=function(){i++;if(i<list.length)show();else end()};$("nx").focus()};
  box.appendChild(b)});
}
function end(){
 clr();var t=list.length,v="",m;window.scrollTo(0,0);
 if(mode=="exam"){var b=st.get("dbest",null);if(b===null||sc>b)st.set("dbest",sc);v=sc>=PASS?"ناجح 🎉":"لم تنجح بعد";m="الحد الأدنى للنجاح "+PASS+" من "+EX+"."}
 else{if(mode=="series"){var sb=st.get("dsb",{});if((sb[sid]||0)<sc){sb[sid]=sc;st.set("dsb",sb)}}
  var p=sc/t;m=p>=.8?"ممتاز! استمر على هذا المستوى.":p>=.5?"جيد، راجع أخطاءك وأعد المحاولة.":"تحتاج مزيداً من التدريب، أعد المحاولة."}
 app.innerHTML='<h2 style="text-align:center">النتيجة</h2><div class="score">'+sc+' / '+t+'</div>'+(v?'<p class="verdict">'+v+'</p>':'')+'<p style="text-align:center">'+m+'</p>';
 if(mode=="exam"&&wr.length){var d=document.createElement("div");d.innerHTML='<h2>مراجعة الأخطاء</h2>'+wr.map(function(n){var q=Q[n];return '<div class="box"><p class="q">'+q.q+'</p><div class="exp"><b>الصواب: '+q.o[q.a]+'</b><br>'+q.e+'</div></div>'}).join("");app.appendChild(d)}
 add("إعادة المحاولة",function(){var l=mode=="exam"?sh(all()).slice(0,EX):mode=="series"?sh(SER[sid].ids):mode=="review"?sh(st.get("dwrong",[])):sh(all()).slice(0,10);if(!l.length)home();else start(l,mode,sid)},"btn");
 add("الرئيسية",home,"btn alt");
}
home();
</script>
